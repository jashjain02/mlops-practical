name: MLOps Pipeline - Auto Training & Deployment (Python 3.10 - Fixed)

on:
  push:
    paths:
      - 'data/**'
      - 'src/**'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force retrain even if no data changes'
        required: false
        default: 'true'
        type: boolean

# MLflow tracking URI will be set dynamically in each job

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      data-changed: ${{ steps.changes.outputs.data }}
      src-changed: ${{ steps.changes.outputs.src }}
      should-train: ${{ steps.decide.outputs.should-train }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check for changes
        id: changes
        run: |
          # For manual triggers, always set to true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "data=true" >> $GITHUB_OUTPUT
            echo "src=true" >> $GITHUB_OUTPUT
          else
            # For push events, check actual changes
            if git diff --name-only HEAD~1 HEAD | grep -E '^data/' > /dev/null; then
              echo "data=true" >> $GITHUB_OUTPUT
            else
              echo "data=false" >> $GITHUB_OUTPUT
            fi
            
            if git diff --name-only HEAD~1 HEAD | grep -E '^(src/|requirements\.txt)' > /dev/null; then
              echo "src=true" >> $GITHUB_OUTPUT
            else
              echo "src=false" >> $GITHUB_OUTPUT
            fi
          fi
      
      - name: Decide if training is needed
        id: decide
        run: |
          # Always run training for manual triggers or when changes are detected
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.changes.outputs.data }}" = "true" ] || [ "${{ steps.changes.outputs.src }}" = "true" ]; then
            echo "should-train=true" >> $GITHUB_OUTPUT
          else
            echo "should-train=false" >> $GITHUB_OUTPUT
          fi

  data-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.should-train == 'true'
    runs-on: ubuntu-latest
    outputs:
      data-valid: ${{ steps.validate.outputs.valid }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Validate data
        id: validate
        run: |
          python -c "
          import pandas as pd
          import os
          
          data_file = 'data/diabetes.csv'
          if not os.path.exists(data_file):
              print('Data file not found')
              exit(1)
          
          try:
              df = pd.read_csv(data_file)
              print(f'Data loaded successfully: {len(df)} rows, {len(df.columns)} columns')
              
              # Check for required columns
              required_cols = ['readmitted', 'age', 'gender', 'race']
              missing_cols = [col for col in required_cols if col not in df.columns]
              if missing_cols:
                  print(f' Missing required columns: {missing_cols}')
                  exit(1)
              
              print('Data validation passed')
              print('valid=true', file=open('$GITHUB_OUTPUT', 'a'))
          except Exception as e:
              print(f'Data validation failed: {e}')
              exit(1)
          "

  preprocess-data:
    needs: [detect-changes, data-validation]
    if: needs.detect-changes.outputs.should-train == 'true' && needs.data-validation.outputs.data-valid == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run data preprocessing
        run: |
          echo "🔄 Starting data preprocessing..."
          python -c "
          import pandas as pd
          from src.data_preprocessing import enrich_and_clean
          
          # Load and preprocess data
          df = pd.read_csv('data/diabetes.csv')
          print(f'Original data shape: {df.shape}')
          
          # Apply preprocessing
          df_processed = enrich_and_clean(df)
          print(f'Processed data shape: {df_processed.shape}')
          
          # Save processed data
          df_processed.to_csv('data/processed_diabetes.csv', index=False)
          print('✅ Data preprocessing completed')
          "
      
      - name: Upload processed data
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/processed_diabetes.csv
          retention-days: 30

  train-model:
    needs: [detect-changes, data-validation, preprocess-data]
    if: needs.detect-changes.outputs.should-train == 'true' && needs.data-validation.outputs.data-valid == 'true'
    runs-on: ubuntu-latest
    outputs:
      model-version: ${{ steps.train.outputs.model-version }}
      run-id: ${{ steps.train.outputs.run-id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Set up DagsHub authentication
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          if [ -z "$DAGSHUB_USERNAME" ] || [ -z "$DAGSHUB_TOKEN" ]; then
            echo "Error: DAGSHUB_USERNAME and DAGSHUB_TOKEN secrets must be set"
            exit 1
          fi
          echo "DAGSHUB_USERNAME=$DAGSHUB_USERNAME" >> $GITHUB_ENV
          echo "DAGSHUB_REPO_NAME=${{ secrets.DAGSHUB_REPO_NAME || 'DiabetesMLops' }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/$DAGSHUB_USERNAME/${{ secrets.DAGSHUB_REPO_NAME }}.mlflow" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=$DAGSHUB_USERNAME" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=$DAGSHUB_TOKEN" >> $GITHUB_ENV
          echo "Configured DagsHub MLflow tracking"
      
      - name: Train model
        id: train
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_REPO_NAME: ${{ secrets.DAGSHUB_REPO_NAME }}
          MLFLOW_TRACKING_URI: https://dagshub.com/${{ secrets.DAGSHUB_USERNAME }}/${{ secrets.DAGSHUB_REPO_NAME }}.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          echo "🤖 Starting model training..."
          echo "Using DagsHub MLflow tracking URI: $MLFLOW_TRACKING_URI"
          python -m src.train --data data/diabetes.csv --register hospital_readmission
          
          # Get the latest model version
          python -c "
          import mlflow
          import os
          from mlflow.tracking import MlflowClient
          
          mlflow.set_tracking_uri(os.getenv('MLFLOW_TRACKING_URI'))
          client = MlflowClient()
          latest_version = client.get_latest_versions('hospital_readmission', stages=['None'])[0]
          print(f'model-version={latest_version.version}', file=open('$GITHUB_OUTPUT', 'a'))
          print(f'run-id={latest_version.run_id}', file=open('$GITHUB_OUTPUT', 'a'))
          "

  evaluate-model:
    needs: [train-model]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Set up DagsHub authentication
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          if [ -z "$DAGSHUB_USERNAME" ] || [ -z "$DAGSHUB_TOKEN" ]; then
            echo "Error: DAGSHUB_USERNAME and DAGSHUB_TOKEN secrets must be set"
            exit 1
          fi
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/$DAGSHUB_USERNAME/${{ secrets.DAGSHUB_REPO_NAME }}.mlflow" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=$DAGSHUB_USERNAME" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=$DAGSHUB_TOKEN" >> $GITHUB_ENV
          echo "Configured DagsHub MLflow tracking"
      
      - name: Evaluate model
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/${{ secrets.DAGSHUB_USERNAME }}/${{ secrets.DAGSHUB_REPO_NAME }}.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MODEL_VERSION: ${{ needs.train-model.outputs.model-version }}
        run: |
          echo "📊 Evaluating model performance..."
          echo "Using DagsHub MLflow tracking URI: $MLFLOW_TRACKING_URI"
          echo "Model version: $MODEL_VERSION"
          python -c "
          import mlflow
          import mlflow.pyfunc
          import pandas as pd
          from sklearn.metrics import roc_auc_score, precision_recall_curve, auc
          from src.utils import map_readmitted
          from src.data_preprocessing import enrich_and_clean
          import os
          
          # Try to use preprocessed data first, fallback to raw data
          processed_path = 'data/processed_diabetes.csv'
          if os.path.exists(processed_path):
              print(f'Using preprocessed data from {processed_path}...')
              df_processed = pd.read_csv(processed_path)
              # Ensure target column exists
              if 'readmitted_30' not in df_processed.columns and 'readmitted' in df_processed.columns:
                  df_processed['readmitted_30'] = df_processed['readmitted'].apply(map_readmitted)
          else:
              print('Preprocessed data not found, using raw data and preprocessing...')
              df = pd.read_csv('data/diabetes.csv')
              df['readmitted_30'] = df['readmitted'].apply(map_readmitted)
              df_processed = enrich_and_clean(df)
          
          print(f'Processed data shape: {df_processed.shape}')
          print(f'Columns: {list(df_processed.columns)}')
          has_age_years = 'age_years' in df_processed.columns
          has_diag1 = 'diag_1_chapter' in df_processed.columns
          has_diag2 = 'diag_2_chapter' in df_processed.columns
          has_diag3 = 'diag_3_chapter' in df_processed.columns
          print('Has required cols? ' +
                f"age_years={has_age_years}, diag1={has_diag1}, diag2={has_diag2}, diag3={has_diag3}")
          
          # Verify we have the required columns
          required_cols = ['age_years', 'diag_1_chapter', 'diag_2_chapter', 'diag_3_chapter']
          missing_cols = [col for col in required_cols if col not in df_processed.columns]
          if missing_cols:
              print(f'ERROR: Missing required columns: {missing_cols}')
              print('Available columns:', list(df_processed.columns))
              exit(1)
          
          # Set MLflow tracking URI
          mlflow.set_tracking_uri(os.getenv('MLFLOW_TRACKING_URI'))
          
          # Load model - get version from environment variable
          model_version = os.environ.get('MODEL_VERSION', 'latest')
          model_uri = f'models:/hospital_readmission/{model_version}'
          print(f'Loading model: {model_uri}')
          model = mlflow.pyfunc.load_model(model_uri)
          
          # Debug: Check what columns the model expects
          print('Model loaded successfully')
          print('Model type:', type(model))
          if hasattr(model, 'metadata') and hasattr(model.metadata, 'signature'):
              print('Model signature:', model.metadata.signature)
          if hasattr(model, 'predict') and hasattr(model.predict, '__self__'):
              print('Model has predict method')
          
          # Make predictions - only drop the target column
          prediction_data = df_processed.drop(columns=['readmitted_30'])
          print(f'Prediction data shape: {prediction_data.shape}')
          print(f'Prediction data columns: {list(prediction_data.columns)}')
          print(f'Prediction data dtypes: {prediction_data.dtypes.to_dict()}')
          
          # Check for any NaN values that might cause issues
          print(f'NaN values per column: {prediction_data.isnull().sum().to_dict()}')
          
          predictions = model.predict(prediction_data)
          
          # Calculate metrics
          roc_auc = roc_auc_score(df_processed['readmitted_30'], predictions)
          precision, recall, _ = precision_recall_curve(df_processed['readmitted_30'], predictions)
          pr_auc = auc(recall, precision)
          
          print(f'ROC-AUC: {roc_auc:.4f}')
          print(f'PR-AUC: {pr_auc:.4f}')
          
          # Set performance thresholds
          if roc_auc < 0.7:
              print('❌ Model performance below threshold (ROC-AUC < 0.7)')
              exit(1)
          else:
              print('✅ Model performance meets requirements')
          "

  notify:
    needs: [train-model, evaluate-model]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify success
        if: needs.train-model.result == 'success' && needs.evaluate-model.result == 'success'
        run: |
          echo "✅ MLOps pipeline completed successfully!"
          echo "Model version: ${{ needs.train-model.outputs.model-version }}"
          echo "Model run ID: ${{ needs.train-model.outputs.run-id }}"
          echo "View model on DagsHub: https://dagshub.com/${{ secrets.DAGSHUB_USERNAME }}/${{ secrets.DAGSHUB_REPO_NAME }}"
      
      - name: Notify failure
        if: needs.train-model.result == 'failure' || needs.evaluate-model.result == 'failure'
        run: |
          echo "❌ MLOps pipeline failed!"
          echo "Check the logs for details."
